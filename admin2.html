<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>আয় ঘর অ্যাডমিন</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#eef5f1;--card:#ffffff;--card2:#f3f8f5;--ink:#0c2a22;--mute:#52695f;--line:#d3e2da;--pri:#0b8a67;--gold:#f5b324;--gold2:#ffd86b;--on:#ffffff;--bad:#c8323a;--hero:linear-gradient(135deg,#0b8a67,#065a45);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120f;--card:#10201b;--card2:#15291f;--ink:#eef8f3;--mute:#9bb8ac;--line:#21392f;--pri:#35d3a1;--on:#042018;--bad:#ff7a80;--hero:linear-gradient(135deg,#0f6a52,#08382c)}}
:root[data-theme="dark"]{--bg:#07120f;--card:#10201b;--card2:#15291f;--ink:#eef8f3;--mute:#9bb8ac;--line:#21392f;--pri:#35d3a1;--on:#042018;--bad:#ff7a80;--hero:linear-gradient(135deg,#0f6a52,#08382c)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",system-ui,sans-serif;font-size:17px;line-height:1.75}
main{max-width:600px;margin:0 auto;padding:14px 14px 104px}
h2{font-size:20px;font-weight:700;margin:0 0 8px;line-height:1.5}
p{margin:0 0 8px;color:var(--mute)}
b{font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top small{display:block;color:var(--mute);font-size:14px;line-height:1.3}
.top strong{font-size:24px;font-weight:800;line-height:1.3}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:600;font-size:15px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero svg{position:absolute;right:-8px;top:-6px;width:150px;opacity:.95}
.hero small{display:block;font-size:15px;opacity:.85;line-height:1.5}
.num{font-size:46px;font-weight:800;line-height:1.3}
.num span{font-size:18px;font-weight:600;margin-left:6px}
.hero .tk{font-weight:600;font-size:17px;color:var(--gold2)}
.bar{height:10px;background:rgba(255,255,255,.22);border-radius:10px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:10px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.btn{font:inherit;font-weight:700;cursor:pointer;width:100%;min-height:54px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2600;padding:12px;margin-top:12px;font-size:18px}
.btn.g{background:var(--pri);color:var(--on)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:22px;line-height:1.4}
.stats small{color:var(--mute);font-size:13px;line-height:1.3}
.days{display:flex;gap:6px;margin-top:8px}
.days i{flex:1;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700;color:var(--mute)}
.days i.on{background:var(--gold);border-color:var(--gold);color:#3a2600}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.ic{width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
.task div.t{flex:1;min-width:0;line-height:1.5}
.task b{display:block;font-size:17px}
.task small{color:var(--mute);font-size:14px}
.task button{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--pri);color:var(--on);cursor:pointer}
.task button:disabled{background:var(--card2);color:var(--mute);cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .m{width:34px;font-size:22px;text-align:center}
.row .n{flex:1;font-weight:600}
.me{color:var(--pri)}
.code{font-size:30px;font-weight:800;color:var(--pri);letter-spacing:2px;text-align:center;background:var(--card2);border-radius:14px;padding:10px;margin:10px 0}
label{display:block;font-weight:600;margin-top:10px;font-size:16px}
input,select{font:inherit;width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:9px 4px;border-bottom:1px solid var(--line);line-height:1.5}
td:last-child{text-align:right;font-weight:700}
details summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:18px}
.pos{color:var(--pri)}.neg{color:var(--bad)}
.note{font-size:14px;color:var(--mute);line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;font:inherit;font-size:12.5px;font-weight:600;background:none;border:0;color:var(--mute);padding:4px 2px;min-height:54px;cursor:pointer;border-radius:14px;line-height:1.3}
nav button span{display:block;font-size:22px}
nav button[aria-current=true]{color:var(--pri);background:var(--card2)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#ov{position:fixed;inset:0;background:rgba(3,12,9,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov .card{max-width:380px;width:100%;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:10;max-width:90%;text-align:center}
.auth{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:24px 16px}
.auth .box{max-width:420px;margin:0 auto}
.ban{border-radius:20px;padding:18px;color:#fff;margin:14px 0;display:block;text-decoration:none;line-height:1.6}
.ban b{display:block;font-size:20px;line-height:1.5}
.msg{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:15px}
.q{font-size:42px;font-weight:800;text-align:center;line-height:1.5;margin:10px 0}
.err{color:var(--bad);font-size:15px;min-height:26px;line-height:1.6}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--gold);background:var(--card2);overflow:hidden;font-weight:800;color:var(--ink);flex:none;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
button#av{padding:0;background:none;border:0;cursor:pointer;line-height:0}
#bell{font:inherit;cursor:pointer;color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;font:inherit;font-weight:600;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-selected=true]{background:var(--pri);color:var(--on);border-color:var(--pri)}
:root[data-pal="b"]{--pri:#4f86f7;--hero:linear-gradient(135deg,#2f6fed,#1b3c9c)}
:root[data-pal="p"]{--pri:#9d75f8;--hero:linear-gradient(135deg,#8b5cf6,#5b21b6)}
:root[data-pal="o"]{--pri:#e8892f;--hero:linear-gradient(135deg,#e07a2b,#a14a0e)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.top button.chip{font:inherit;cursor:pointer;color:var(--ink)}
select{font:inherit}
</style>
</head>
<body>
<main>
<div id="gate"><div class="card"><h2>অ্যাডমিন লগইন</h2>
<label for="em">ইমেইল</label><input id="em" type="email" autocomplete="email">
<label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
<div class="err" id="gm" aria-live="polite"></div>
<button class="btn g" id="gi">লগইন</button><button class="btn alt" id="gg">Google দিয়ে লগইন</button></div></div>
<div id="app" hidden>
<div class="top"><strong>অ্যাডমিন প্যানেল</strong><div style="display:flex;gap:8px"><button class="chip" id="rf">রিফ্রেশ</button><button class="chip" id="lo">লগআউট</button></div></div>
<div class="seg" id="tb"></div><div id="ct"></div>
</div>
</main>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAd8kfAqZrxogEixGTaMaDqOJHTMGqRxPU",authDomain:"ay-ghor.firebaseapp.com",projectId:"ay-ghor",storageBucket:"ay-ghor.firebasestorage.app",messagingSenderId:"175063762609",appId:"1:175063762609:web:680d35c132f88343ac8490"});
var auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
var $=function(i){return document.getElementById(i)};
function bn(n,d){return (+n||0).toLocaleString("bn-BD",{maximumFractionDigits:d||0})}
function tk(n){return bn(n,2)+" টাকা"}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2500)}
function avH(p,n,z){var c=(n||"?").trim().charAt(0)||"?",h=p&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p)?'<img src="'+p+'" alt="">':esc(c);return '<span class="av" style="width:'+z+'px;height:'+z+'px;font-size:'+Math.round(z*.45)+'px">'+h+'</span>'}
var U=[],WD=[],CF={},SEL=null,TAB="dash",TODAY=new Date().toISOString().slice(0,10),RATE=1000;
var TABS=[["dash","ড্যাশ"],["users","ইউজার"],["wd","টাকা"],["set","সেটিং"]];
$("tb").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
$("tb").onclick=function(e){var b=e.target.closest("button");if(b){TAB=b.dataset.t;SEL=null;draw()}};
function loadAll(){
  return Promise.all([db.collection("users").get(),db.collection("withdrawals").get(),db.collection("config").doc("site").get()]).then(function(r){
    U=r[0].docs.map(function(d){var x=d.data();x.id=d.id;return x});
    WD=r[1].docs.map(function(d){var x=d.data();x.id=d.id;x.t=x.at?x.at.toMillis():0;return x}).sort(function(a,b){return b.t-a.t});
    CF=r[2].exists?r[2].data():{};RATE=+CF.rate||1000;draw();
  }).catch(function(e){toast("লোড হয়নি: "+(e.code||""))});
}
function draw(){
  Array.prototype.forEach.call($("tb").children,function(b){b.setAttribute("aria-selected",b.dataset.t===TAB)});
  if(TAB==="dash")dash();else if(TAB==="users")users();else if(TAB==="wd")wds();else sets();
}
function dash(){
  var tc=0,tl=0,ac=0;U.forEach(function(u){tc+=u.coins||0;tl+=u.life||0;if(u.day===TODAY)ac++});
  var pe=WD.filter(function(w){return w.status==="pending"}),pa=0,pd=0;pe.forEach(function(w){pa+=w.amount||0});
  WD.forEach(function(w){if(w.status==="paid")pd+=w.amount||0});
  var T=[["মোট ইউজার",bn(U.length)],["আজ সক্রিয়",bn(ac)],["অপেক্ষমাণ অনুরোধ",bn(pe.length)],["ইউজারদের মোট কয়েন",bn(tc)],["এখন তুললে দিতে হবে",tk(tc/RATE)],["পরিশোধ হয়েছে",tk(pd)]];
  $("ct").innerHTML='<div class="card"><h2>সারসংক্ষেপ</h2>'+T.map(function(x){return '<div class="row"><div class="n">'+x[0]+'</div><b>'+x[1]+'</b></div>'}).join("")+'</div><div class="card"><h2>অপেক্ষমাণ টাকা</h2><p>'+bn(pe.length)+' টি অনুরোধে মোট '+tk(pa)+'। "টাকা" ট্যাবে গিয়ে বিকাশ বা নগদে পাঠিয়ে "পরিশোধ" চাপুন।</p></div>';
}
function users(){
  $("ct").innerHTML='<div class="card"><label for="q" style="margin-top:0">ইউজার খুঁজুন (নাম)</label><input id="q"></div><div id="dt"></div><div class="card"><div id="ul"></div></div>';
  $("q").oninput=ulist;$("dt").onclick=act;$("ul").onclick=function(e){var r=e.target.closest(".row");if(r){SEL=r.dataset.id;detail();window.scrollTo(0,0)}};
  ulist();detail();
}
function ulist(){
  var q=($("q").value||"").toLowerCase(),L=U.filter(function(u){return (u.name||"").toLowerCase().indexOf(q)>=0}).sort(function(a,b){return (b.life||0)-(a.life||0)}).slice(0,100);
  $("ul").innerHTML=L.length?L.map(function(u){return '<div class="row" data-id="'+u.id+'" style="cursor:pointer">'+avH(u.photo,u.name,36)+'<div class="n">'+esc(u.name)+(u.banned?" 🚫":"")+((u.life||0)>(u.ads||0)*20+3000?" ⚠":"")+'</div><b>'+bn(u.coins)+'</b></div>'}).join(""):"<p>কেউ নেই।</p>";
}
function detail(){
  var u=U.filter(function(x){return x.id===SEL})[0];
  if(!u){$("dt").innerHTML="";return}
  var R=[["নাম",esc(u.name)],["কয়েন",bn(u.coins)+" ("+tk((u.coins||0)/RATE)+")"],["মোট আয়",bn(u.life)],["মোট অ্যাড",bn(u.ads)],["আজ অ্যাড",u.day===TODAY?bn(u.today):"০"],["রেফার কোড",esc(u.code)],["কার কোডে এসেছে",esc(u.refBy||"-")],["অবস্থা",u.banned?"বন্ধ":"চালু"],["সন্দেহ",((u.life||0)>(u.ads||0)*20+3000)?"⚠ কয়েন খেলার চেয়ে অনেক বেশি":"নেই"]];
  $("dt").innerHTML='<div class="card" style="text-align:center">'+avH(u.photo,u.name,64)+'<table style="text-align:left;margin-top:8px"><tbody>'+R.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join("")+'</tbody></table>'+
  '<label for="amt" style="text-align:left">কয়েনের পরিমাণ</label><input id="amt" type="number" min="0" inputmode="numeric">'+
  '<div class="seg" style="margin-top:10px"><button data-a="add">+ যোগ</button><button data-a="sub">− কমান</button><button data-a="set">সেট</button></div>'+
  '<button class="btn alt" data-a="ban">'+(u.banned?"আনব্যান করুন":"ব্যান করুন")+'</button><button class="btn alt" data-a="del" style="color:var(--bad)">ইউজার মুছুন</button></div>';
}
function chg(id,o,m){db.collection("users").doc(id).update(o).then(function(){toast(m);loadAll()}).catch(function(e){toast("হয়নি: "+(e.code||""))})}
function act(e){
  var b=e.target.closest("button");if(!b||!SEL)return;var u=U.filter(function(x){return x.id===SEL})[0],n=Math.floor(+($("amt")||{}).value||0),a=b.dataset.a;
  if(a==="add"||a==="sub"||a==="set"){if(!(n>0||(a==="set"&&n===0))){toast("পরিমাণ লিখুন");return}
    if(a==="add")chg(u.id,{coins:FV.increment(n)},"যোগ হয়েছে");
    else if(a==="sub")chg(u.id,{coins:Math.max(0,(u.coins||0)-n)},"কমানো হয়েছে");
    else chg(u.id,{coins:n},"সেট হয়েছে")}
  else if(a==="ban")chg(u.id,{banned:!u.banned},u.banned?"আনব্যান হয়েছে":"ব্যান হয়েছে");
  else if(a==="del"&&confirm("এই ইউজারের ডেটা মুছবেন? ফেরানো যাবে না।"))db.collection("users").doc(u.id).delete().then(function(){toast("মুছে গেছে");SEL=null;loadAll()}).catch(function(){toast("হয়নি")});
}
function wds(){
  var L=WD.slice().sort(function(a,b){return (a.status==="pending"?0:1)-(b.status==="pending"?0:1)||b.t-a.t}).slice(0,60),S={pending:"অপেক্ষমাণ",paid:"পরিশোধিত",rejected:"বাতিল"};
  $("ct").innerHTML='<div class="card"><h2>টাকা তোলার অনুরোধ</h2>'+(L.length?L.map(function(w){return '<div class="task"><div class="t"><b>'+esc(w.name)+' · '+tk(w.amount)+'</b><small>'+esc((w.method||"")+" "+(w.number||""))+" · "+(w.at?w.at.toDate().toLocaleDateString("bn-BD"):"")+' · '+(S[w.status]||w.status)+'</small></div>'+(w.status==="pending"?'<button data-p="'+w.id+'">পরিশোধ</button><button data-r="'+w.id+'" style="background:var(--card2);color:var(--ink)">বাতিল</button>':"")+'</div>'}).join(""):"<p>কোনো অনুরোধ নেই।</p>")+'</div><p class="note">বাতিল করলে কয়েন ইউজারকে ফেরত যায়।</p>';
  $("ct").onclick=function(e){var b=e.target.closest("button");if(!b)return;
    if(b.dataset.p)db.collection("withdrawals").doc(b.dataset.p).update({status:"paid"}).then(function(){toast("পরিশোধ চিহ্নিত");loadAll()});
    if(b.dataset.r){var w=WD.filter(function(x){return x.id===b.dataset.r})[0];if(!confirm("বাতিল করে কয়েন ফেরত দেবেন?"))return;
      var bt=db.batch();bt.update(db.collection("withdrawals").doc(w.id),{status:"rejected"});bt.update(db.collection("users").doc(w.uid),{coins:FV.increment(w.coins||0)});
      bt.commit().then(function(){toast("বাতিল ও ফেরত হয়েছে");loadAll()}).catch(function(){toast("হয়নি")})}};
}
function sets(){
  var C=CF,NT=C.notes||[];
  $("ct").innerHTML='<div class="card"><h2>ব্যানার ও বার্তা</h2>'+
  '<label for="bt">ব্যানারের শিরোনাম</label><input id="bt"><label for="bs">ব্যানারের ছোট লেখা</label><input id="bs"><label for="bl">ব্যানারের লিংক (ঐচ্ছিক)</label><input id="bl" type="url" placeholder="https://">'+
  '<label for="bc">ব্যানারের রং</label><select id="bc"><option value="g">সবুজ</option><option value="y">সোনালি</option><option value="b">নীল</option><option value="r">লাল</option></select>'+
  '<label for="am">ঘোষণা বার্তা</label><input id="am"><label for="pr">সাপ্তাহিক পুরস্কারের লেখা</label><input id="pr"><label for="ct">যোগাযোগের তথ্য (WhatsApp নম্বর ইত্যাদি)</label><input id="ct"></div>'+
  '<div class="card"><h2>কয়েনের হিসাব</h2><label for="rev">প্রতি অ্যাডে আপনার আয় (টাকা)</label><input id="rev" type="number" step="0.01" min="0.01"><label for="shr">ইউজারকে দেবেন (শতাংশ)</label><input id="shr" type="number" min="5" max="90"><label for="rate">কত কয়েনে ১ টাকা</label><input id="rate" type="number" min="100" step="100"><p class="note" id="cp" style="margin-top:8px"></p>'+
  '<button class="btn g" id="sv">সব সেভ করুন</button></div>'+
  '<div class="card"><h2>নোটিফিকেশন পাঠান</h2><label for="nt">শিরোনাম</label><input id="nt"><label for="nb">বার্তা</label><input id="nb"><button class="btn g" id="np">সবাইকে পাঠান</button><div style="margin-top:10px">'+NT.map(function(x,i){return '<div class="row"><div class="n"><b>'+esc(x.t)+'</b><br><small>'+esc(x.m||"")+'</small></div><button class="chip" data-d="'+i+'" style="font:inherit;cursor:pointer;color:var(--ink)">মুছুন</button></div>'}).join("")+'</div></div>';
  var d={bt:C.bt,bs:C.bs,bl:C.bl,bc:C.bc||"g",am:C.am,pr:C.pr,ct:C.ct,rev:C.rev||0.2,shr:C.shr||40,rate:C.rate||1000};
  Object.keys(d).forEach(function(k){$(k).value=d[k]==null?"":d[k]});
  function cp(){var c=Math.round((+$("rev").value||0)*(+$("shr").value||0)/100*(+$("rate").value||0));$("cp").textContent="প্রতি অ্যাডে ইউজার পাবে "+bn(c)+" কয়েন, আপনার লাভ "+tk((+$("rev").value||0)-c/(+$("rate").value||1))+"।"}
  ["rev","shr","rate"].forEach(function(k){$(k).oninput=cp});cp();
  $("sv").onclick=function(){var l=$("bl").value.trim();if(l&&!/^https?:\/\//.test(l)){toast("লিংক http বা https দিয়ে শুরু হতে হবে");return}
    var o={};["bt","bs","bl","bc","am","pr","ct"].forEach(function(k){o[k]=$(k).value.trim()});o.rev=+$("rev").value||0.2;o.shr=+$("shr").value||40;o.rate=+$("rate").value||1000;
    db.collection("config").doc("site").set(o,{merge:true}).then(function(){toast("সেভ হয়েছে");loadAll()}).catch(function(){toast("সেভ হয়নি")})};
  $("np").onclick=function(){var t=$("nt").value.trim(),m=$("nb").value.trim();if(!t){toast("শিরোনাম লিখুন");return}
    var n=NT.slice(0,19);n.unshift({t:t,m:m,at:Date.now()});db.collection("config").doc("site").set({notes:n},{merge:true}).then(function(){toast("পাঠানো হয়েছে");loadAll()})};
  $("ct").onclick=function(e){var b=e.target.closest("button[data-d]");if(!b)return;var n=NT.slice();n.splice(+b.dataset.d,1);db.collection("config").doc("site").set({notes:n},{merge:true}).then(function(){toast("মুছে গেছে");loadAll()})};
}
$("rf").onclick=loadAll;
$("lo").onclick=function(){auth.signOut().then(function(){location.reload()})};
$("gi").onclick=function(){auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){$("gm").textContent="ইমেইল বা পাসওয়ার্ড ভুল।"})};
$("gg").onclick=function(){var p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(function(x){if(x.code==="auth/popup-blocked")auth.signInWithRedirect(p);else $("gm").textContent="Google লগইন হয়নি।"})};
auth.onAuthStateChanged(function(u){
  if(!u){$("gate").hidden=false;$("app").hidden=true;return}
  db.collection("admins").doc(u.uid).get().then(function(a){
    if(a.exists){$("gate").hidden=true;$("app").hidden=false;loadAll()}
    else{$("gm").textContent="এই অ্যাকাউন্ট অ্যাডমিন নয়: "+(u.email||"");auth.signOut()}
  }).catch(function(){$("gm").textContent="যাচাই করা যায়নি।"});
});
</script>
</body>
</html>
